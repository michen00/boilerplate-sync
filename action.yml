---
name: Boilerplate Sync
description: Sync project files from boilerplate repositories
author: Michael Chen

branding:
  icon: refresh-cw
  color: blue

inputs:
  sources:
    description: |
      YAML array of source repositories. Each source contains:
        - source: GitHub repo in 'owner/repo' format
        - ref: (optional) git ref (branch, tag, commit SHA)
        - source-token: (optional) token for private repos (falls back to github-token)
        - default_files: (optional) list of file globs where local_path === source_path
        - file_pairs: (optional) array of file mappings with local_path and optional source_path
      At least one of default_files or file_pairs is required per source.
      Glob patterns supported in default_files: *, **, ?, [abc], {a,b}
    required: true
  github-token:
    description: GitHub token for accessing source repos
    required: true
    default: ${{ github.token }}
  create-missing:
    description: Create project files that do not exist yet
    required: false
    default: 'true'
  fail-on-error:
    description: Fail the action if any file sync fails
    required: false
    default: 'false'
  hooks:
    description: |
      YAML mapping of lifecycle hooks. Each command runs in bash from the workspace:
        - pre-sync: (optional) command or list of commands, run once before any file is fetched
        - transform: (optional) map of local path or glob to a command that reads the fetched
          content on stdin and prints the content to keep; runs before the unchanged check
        - post-sync: (optional) command or list of commands, run once after all files are processed
      Hook processes get none of this action's inputs or tokens in their environment, and may not
      name a synced path. Check out with persist-credentials: false when you use hooks.
      See the README's Hooks section.
    required: false
    default: ''

outputs:
  has-changes:
    description: Whether any files were updated or created (true/false)
  updated-count:
    description: Number of files updated or created
  failed-count:
    description: Number of files that failed to sync
  skipped-count:
    description: Number of files skipped (unchanged, or missing when create-missing is disabled)
  summary:
    description: JSON summary of all sync operations

runs:
  using: node24
  main: dist/index.js
