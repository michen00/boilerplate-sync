---
# Reserved head branch prefix: chore/sync-boilerplate/<run_id> (automation only; supersession targets this stream).
name: Sync boilerplate files (non-workflow)

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync boilerplate files
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: chore/sync-boilerplate/${{ github.run_id }}
      COMMIT_MESSAGE: 'chore: auto-sync boilerplate files'
    steps:
      - name: Verify App credentials are configured
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_KEY_SET: ${{ secrets.APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ "$APP_KEY_SET" != "true" ]; then
            echo "::error::Set vars.APP_CLIENT_ID and secrets.APP_PRIVATE_KEY first."
            exit 1
          fi
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Sync files
        id: sync
        uses: michen00/boilerplate-sync@main
        with:
          sources: |
            - source: michen00/template
              default_files:
                - .editorconfig
                - .github/actionlint.yaml
                - .github/actions/detect-bot-author/action.yml
                - .github/scripts/approve-bot-gated-runs.sh
                - .gitlint
                - .markdownlint.yml
                - .prettierrc
                - tombi.toml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: 'true'
      - name: Build PR body
        if: steps.sync.outputs.has-changes == 'true'
        id: pr-body
        env:
          SYNC_SUMMARY: ${{ steps.sync.outputs.summary }}
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const summary = JSON.parse(process.env.SYNC_SUMMARY);

            let body = `## Boilerplate Sync\n\nThis PR updates project files from their boilerplate sources.\n\n`;

            // Updated + Created files
            const updated = [...summary.updated, ...summary.created];
            if (updated.length > 0) {
              body += `<details>\n<summary>Updated (${updated.length} file${updated.length === 1 ? '' : 's'})</summary>\n\n`;
              for (const r of updated) {
                body += `- \`${r.config.local_path}\`\n`;
              }
              body += `\n</details>\n\n`;
            }

            // Skipped files
            if (summary.skipped.length > 0) {
              body += `<details>\n<summary>Skipped (${summary.skipped.length} file${summary.skipped.length === 1 ? '' : 's'})</summary>\n\n`;
              for (const r of summary.skipped) {
                const reason = r.error || 'No changes detected';
                body += `- \`${r.config.local_path}\` - ${reason}\n`;
              }
              body += `\n</details>\n\n`;
            }

            // Failed files (expanded by default)
            if (summary.failed.length > 0) {
              body += `<details open>\n<summary>Failed (${summary.failed.length} file${summary.failed.length === 1 ? '' : 's'})</summary>\n\n`;
              for (const r of summary.failed) {
                body += `- \`${r.config.local_path}\` - ${r.error}\n`;
              }
              body += `\n</details>\n\n`;
            }

            return body;
      - name: Create pull request
        if: steps.sync.outputs.has-changes == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: ${{ env.BRANCH_NAME }}

          title: ${{ env.COMMIT_MESSAGE }}
          body: ${{ steps.pr-body.outputs.result }}

          commit-message: ${{ env.COMMIT_MESSAGE }}
          signoff: true

          sign-commits: true
          token: ${{ steps.app-token.outputs.token }}

          delete-branch: true
      - name: Supersede older boilerplate PRs
        if: steps.create-pr.outputs.pull-request-number != ''
        uses: ./.github/actions/supersede-boilerplate-prs
        with:
          stream-prefix: chore/sync-boilerplate
          successor-pr-number: ${{ steps.create-pr.outputs.pull-request-number }}
          token: ${{ steps.app-token.outputs.token }}
