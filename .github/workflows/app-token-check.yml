---
name: App token check

# On-demand check of the App credential bot-automerge uses: mints a token from
# `vars.APP_CLIENT_ID` and the Actions-store `secrets.APP_PRIVATE_KEY`, then reads the
# repository with it. The token carries whatever the App is granted. The Dependabot-store
# copy of the key cannot be checked here: only a Dependabot-triggered run reads that store.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify App credentials are configured
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_KEY_SET: ${{ secrets.APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ "$APP_KEY_SET" != "true" ]; then
            echo "::error::Set vars.APP_CLIENT_ID and secrets.APP_PRIVATE_KEY first."
            exit 1
          fi
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Probe repo access with the minted token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name' \
            | grep -qx "$GITHUB_REPOSITORY"
          echo "::notice::App token minted and repo access confirmed"
