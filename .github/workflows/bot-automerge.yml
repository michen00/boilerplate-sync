---
name: Bot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# The repository needs a ruleset that requires status checks to pass.
#
# Hands-free dist commits need the App: the `APP_CLIENT_ID` variable, and the
# `APP_PRIVATE_KEY` secret in both the Actions and Dependabot stores, since
# Dependabot-triggered runs read only the Dependabot store. A commit under `GITHUB_TOKEN`
# starts no CI.

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  # Keyed on the actor too: the App's dist push starts a run as the App, which on a
  # PR-only key would cancel this one, possibly between approving and arming. Arming twice
  # is a no-op.
  group: bot-automerge-${{ github.event.pull_request.number }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  bot-automerge:
    runs-on: ubuntu-latest
    # The guard reads `pull_request.user.login`, not `github.actor`: the actor is whoever
    # caused this event, so a later push by anyone else, the App's dist push included,
    # would skip the job. The re-run after a dist push terminates: the rebuild is
    # idempotent, so it pushes nothing and arms again, which is a no-op.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'pre-commit-ci[bot]') &&
      !contains(github.event.pull_request.labels.*.name, 'do not auto-merge')
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # `if:` cannot read `secrets`, so the key's presence is exposed here.
      APP_KEY_SET: ${{ secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependabot metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        id: dependabot
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
      - name: Build
        run: make build
      - name: Install pre-commit
        run: |
          pip install --upgrade pip
          pip install --upgrade pre-commit
      - name: Cache pre-commit hooks
        id: cache-pre-commit-hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          CACHE_NUMBER: 0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}-${{ env.CACHE_NUMBER }} # yamllint disable-line rule:line-length
      - name: Install pre-commit hooks
        if: steps.cache-pre-commit-hooks.outputs.cache-hit != 'true'
        run: |
          pre-commit install-hooks
      - run: make check
      - name: Determine if-no-commit log level
        id: log-level
        env:
          ACTOR: ${{ github.event.pull_request.user.login }}
          DEPENDENCY_TYPE: ${{ steps.dependabot.outputs.dependency-type }}
        run: |
          if [ "$ACTOR" = "pre-commit-ci[bot]" ] || [[ "$DEPENDENCY_TYPE" == indirect:* ]]; then
            echo "level=info" >> "$GITHUB_OUTPUT"
          elif [ "$ACTOR" = "dependabot[bot]" ]; then
            if [ "$DEPENDENCY_TYPE" = "direct:development" ]; then
              echo "level=notice" >> "$GITHUB_OUTPUT"
            elif [ "$DEPENDENCY_TYPE" = "direct:production" ]; then
              # Warn, not fail: no commit is harmless, as CI checks that `dist` is current.
              echo "level=warning" >> "$GITHUB_OUTPUT"
            else
              echo "level=warning" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "level=warning" >> "$GITHUB_OUTPUT"
          fi
      # Only the dist commit uses this token.
      - name: Mint app token
        id: app-token
        if: vars.APP_CLIENT_ID != '' && env.APP_KEY_SET == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Commit build changes
        id: commit
        uses: iarekylew00t/verified-bot-commit@1ee4374942e5c5f814e9b3121d766cbe45cea360 # v2.3.6
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          if-no-commit: ${{ steps.log-level.outputs.level }}
          message: 'build(dist): rebuild the action'
          update-local: false
          files: |
            dist/**
      # The default branch, in a directory apart from the pull request's checkout above.
      # The next step fetches the pull request's commits into it for `git merge-tree`.
      - name: Check out the default branch's history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: default-branch-history
          fetch-depth: 0
          persist-credentials: false

      - name: Verify every commit was created by GitHub
        id: provenance
        working-directory: default-branch-history
        env:
          GH_TOKEN: ${{ env.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # Empty unless this run pushed a dist commit.
          PUSHED: ${{ steps.commit.outputs.ref }}
          # The App's login, as the author of its dist commits and as their pusher.
          BUILDER: boilerplate-sync-bot[bot]
        run: |
          # An author login comes from an email anyone can set, so the head is trusted
          # only when GitHub created every commit, and:
          # - a non-merge commit is by the pull request's author or BUILDER;
          # - a merge is a clean merge of two parents or an admin's, since GitHub also
          #   signs a conflict resolved by hand;
          # - every commit that anyone but the author or an admin pushed, in any push
          #   since the branch was created, is a clean merge of two parents or, in a push
          #   by BUILDER, BUILDER's own commit to dist/ alone, since GitHub also signs
          #   whatever an App or `GITHUB_TOKEN` creates through its API.
          # Every check reads the one head commit that a trusted verdict names in `head`,
          # which must be the head this run's event brought or the commit this run pushed.
          # Fails closed: a failed query or fetch leaves `trusted` unset; later steps skip.
          set -euo pipefail
          for attempt in $(seq 1 30); do
            head=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')
            if ! [[ "$head" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
              echo "::error::could not read the PR's head commit; holding."
              exit 1
            fi
            # The API can report the event's head for a while after this run's push.
            if [ -z "$PUSHED" ] || [ "$head" != "$EVENT_HEAD" ] || [ "$attempt" -eq 30 ]; then
              break
            fi
            sleep 5
          done
          if [ "$head" != "${PUSHED:-$EVENT_HEAD}" ]; then
            echo "::warning::the head is no longer the one this event brought or this run" \
                 "pushed; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          jq_rows='.[] | [
            (if (.commit.verification.verified == true)
                and (.commit.verification.reason == "valid")
                and ((.committer.login // "") == "web-flow")
                and ((.commit.verification.payload // "") | split("\n")
                     | any(startswith("committer GitHub <noreply@github.com>")))
             then "github" else "elsewhere" end),
            (if (.parents | length) >= 2 then "merge" else "plain" end),
            (.author.login // "<none>"),
            .sha,
            ([.parents[].sha] | join(" "))
          ] | join("|")'
          # The endpoint returns at most 250 commits and still exits 0, so refuse rather
          # than inspect part of the pull request.
          total=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.commits')
          # A non-integer count makes the tests below error, which `if` reads as false.
          if ! [[ "$total" =~ ^[0-9]+$ ]]; then
            echo "::error::could not read the PR's commit count; holding."
            exit 1
          fi
          if [ "$total" -gt 250 ]; then
            echo "::warning::${total} commits exceeds the 250 this API returns; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          rows=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/commits" --paginate --jq "$jq_rows")
          seen=$(printf '%s\n' "$rows" | grep -c . || true)
          if [ "$seen" -ne "$total" ]; then
            echo "::warning::inspected ${seen} of ${total} commits; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          # These differ when a push lands between the reads.
          fetched=$(git rev-parse --verify 'refs/remotes/pr/head^{commit}')
          listed=$(printf '%s\n' "$rows" | awk -F'|' 'NF { sha = $4 } END { print sha }')
          if [ "$fetched" != "$head" ] || [ "$listed" != "$head" ]; then
            echo "::warning::the head moved while it was being inspected; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Succeeds for a commit with exactly two parents whose tree is their clean merge.
          mechanical() {
            local sha=$1 first second extra clean
            read -r first second extra <<< "$2"
            if [ -z "$second" ] || [ -n "$extra" ]; then
              return 1
            fi
            clean=$(git merge-tree --write-tree --no-messages "$first" "$second") || return 1
            [ "$clean" = "$(git rev-parse --verify "${sha}^{tree}")" ]
          }
          # Succeeds for a commit with one parent, by BUILDER, that changes only dist/.
          rebuilt() {
            local sha=$1 by paths
            [[ "$2" =~ ^[0-9a-f]+$ ]] || return 1
            by=$(awk -F'|' -v sha="$sha" '$4 == sha { print $3 }' <<< "$rows")
            [ "$by" = "$BUILDER" ] || return 1
            paths=$(git diff-tree -r --no-commit-id --name-only "$sha") || return 1
            [ -n "$paths" ] && ! grep -qv '^dist/' <<< "$paths"
          }
          # Succeeds if the repository reports `admin` for the login, asked once per login.
          admins=' '
          others=' '
          admin() {
            local login=$1 permission
            if [ -z "$login" ] || [ "$login" = "<none>" ]; then
              return 1
            fi
            case $admins in *" $login "*) return 0 ;; esac
            case $others in *" $login "*) return 1 ;; esac
            permission=$(gh api "repos/${GH_REPO}/collaborators/${login}/permission" \
              --jq .permission) || permission=unknown
            if [ "$permission" = admin ]; then
              admins="${admins}${login} "
              return 0
            fi
            others="${others}${login} "
            return 1
          }
          rejected=0
          while IFS='|' read -r origin kind commit_author sha parents; do
            [ -z "$origin" ] && continue
            if [ "$origin" != "github" ]; then
              echo "::warning::a commit was not created by GitHub; holding."
              rejected=$((rejected + 1))
            elif [ "$kind" != "merge" ] \
                 && [ "$commit_author" != "$AUTHOR" ] \
                 && [ "$commit_author" != "$BUILDER" ]; then
              echo "::warning::non-merge commit authored by ${commit_author}; holding."
              rejected=$((rejected + 1))
            elif [ "$kind" = "merge" ] && ! mechanical "$sha" "$parents" &&
                 ! admin "$commit_author"; then
              echo "::warning::merge ${sha} by ${commit_author} is neither a clean merge" \
                   "of two parents nor an admin's; holding."
              rejected=$((rejected + 1))
            fi
          done <<< "$rows"
          # Every push since the branch was last created, newest first, as GitHub
          # records it. A held push's commits stay in the branch, so the push that
          # started this run cannot vouch for the branch alone.
          for attempt in 1 2 3; do
            pushes=$(gh api -X GET "repos/${GH_REPO}/activity" -f ref="refs/heads/${HEAD_REF}" \
              -f direction=desc -F per_page=100 --paginate \
              --jq '.[] | [.activity_type, (.actor.login // "<none>"), .before, .after]
                | join("|")')
            newest=${pushes%%$'\n'*}
            [ "${newest##*|}" = "$head" ] && break
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          if [ "${newest##*|}" != "$head" ]; then
            echo "::warning::the branch's push history does not reach its head; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Assigned, so a failed listing fails the step. `^HEAD` leaves out the default
          # branch's commits, which a catch-up brings in but did not write.
          in_branch=$(git rev-list "$head" '^HEAD')
          created=false
          while IFS='|' read -r change pusher before after; do
            [ -z "$change" ] && continue
            if [ "$pusher" != "$AUTHOR" ] && ! admin "$pusher"; then
              case $change in
                push | force_push) range=("$after" "^${before}") ;;
                branch_creation) range=("$after") ;;
                *) range=() ;;
              esac
              if [ "${#range[@]}" -eq 0 ]; then
                echo "::warning::${pusher} changed the branch by ${change}; holding."
                rejected=$((rejected + 1))
              else
                for commit in "${range[@]}"; do
                  commit=${commit#^}
                  if ! [[ "$commit" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
                    echo "::error::the push history names no commit; holding."
                    exit 1
                  fi
                  git cat-file -e "${commit}^{commit}" 2>/dev/null ||
                    git fetch -q --no-tags origin "$commit"
                done
                added=$(git rev-list --parents "${range[@]}" '^HEAD')
                while read -r sha parents; do
                  [ -z "$sha" ] && continue
                  grep -qxF "$sha" <<< "$in_branch" || continue
                  if mechanical "$sha" "$parents"; then
                    continue
                  elif [ "$pusher" != "$BUILDER" ]; then
                    echo "::warning::${pusher} pushed ${sha}, which is not a clean merge" \
                         "of two parents; holding."
                    rejected=$((rejected + 1))
                  elif ! rebuilt "$sha" "$parents"; then
                    echo "::warning::${pusher} pushed ${sha}, which is neither a clean" \
                         "merge of two parents nor its own commit to dist/ alone; holding."
                    rejected=$((rejected + 1))
                  fi
                done <<< "$added"
              fi
            fi
            if [ "$change" = branch_creation ]; then
              created=true
              break
            fi
          done <<< "$pushes"
          if [ "$created" != true ]; then
            echo "::warning::the branch's push history does not reach its creation;" \
                 "holding."
            rejected=$((rejected + 1))
          fi
          if [ "$rejected" -ne 0 ]; then
            echo "trusted=false" >>"$GITHUB_OUTPUT"
          else
            echo "trusted=true" >>"$GITHUB_OUTPUT"
            echo "head=${head}" >>"$GITHUB_OUTPUT"
          fi

      - name: Check merge eligibility
        id: eligible
        if: steps.provenance.outputs.trusted == 'true'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
          ECOSYSTEM: ${{ steps.dependabot.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          if [ "$AUTHOR" = "pre-commit-ci[bot]" ]; then
            echo "::notice::pre-commit-ci hook bump; eligible."
            echo "should_merge=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              echo "::notice::Dependabot ${UPDATE_TYPE}; eligible."
              echo "should_merge=true" >>"$GITHUB_OUTPUT"
              ;;
            version-update:semver-major)
              # CI exercises only code a pull request runs, so a major used only by a
              # workflow that no pull request starts merges untested.
              echo "::notice::${ECOSYSTEM:-unknown} major; eligible on green CI."
              echo "should_merge=true" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::Holding ${UPDATE_TYPE:-unknown update type} for a human."
              echo "should_merge=false" >>"$GITHUB_OUTPUT"
              ;;
          esac
      # No wait for checks: auto-merge waits for required checks server-side.
      # Re-read the label: one applied during this run is not in the event payload, so the
      # pull request could otherwise be armed with the kill switch applied.
      - name: Re-check the kill switch
        id: switch
        if: steps.eligible.outputs.should_merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read into a variable under `set -e`, so a failed query is not read as "no label".
          set -euo pipefail
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          # Case-insensitive, as GitHub compares label names.
          if grep -qixF 'do not auto-merge' <<< "$labels"; then
            echo "::warning::do not auto-merge applied since this run started; not arming."
            echo "proceed=false" >>"$GITHUB_OUTPUT"
          else
            echo "proceed=true" >>"$GITHUB_OUTPUT"
          fi

      # Approve as github-actions, never as the App: where the base branch requires
      # approval of the most recent push, the last pusher's approval does not count, and
      # the App pushes the dist commit.
      - name: Approve PR
        if: steps.switch.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_HEAD: ${{ steps.provenance.outputs.head }}
        run: |
          # A failure here also skips arming.
          if ! [[ "$VERIFIED_HEAD" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "::error::no verified head commit to approve; not arming."
            exit 1
          fi
          REVIEW_STATE=$(gh pr view "$PR_NUMBER" --json reviewDecision -q .reviewDecision)
          if [ "$REVIEW_STATE" = "APPROVED" ]; then
            echo "::notice::PR already approved."
            exit 0
          fi
          echo "::notice::Approving $VERIFIED_HEAD ..."
          # Pinned to the verified head, not whatever the head is by then.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            -f "commit_id=$VERIFIED_HEAD" \
            -f 'event=APPROVE' \
            -f 'body=Automated approval: make check passed on this commit.'
      - name: Enable auto-merge
        if: steps.switch.outputs.proceed == 'true'
        env:
          VERIFIED_HEAD: ${{ steps.provenance.outputs.head }}
        run: |
          echo "::notice::Enabling auto-merge for PR #$PR_NUMBER"
          gh pr merge --auto --squash --match-head-commit "$VERIFIED_HEAD" "$PR_NUMBER"
