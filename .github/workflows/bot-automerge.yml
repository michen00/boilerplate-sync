---
name: Bot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# The repository needs a ruleset that requires status checks to pass.
#
# Hands-free dist commits need the App: the `APP_CLIENT_ID` variable, and the
# `APP_PRIVATE_KEY` secret in both the Actions and Dependabot stores, since
# Dependabot-triggered runs read only the Dependabot store. A commit under `GITHUB_TOKEN`
# starts no CI.

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  # Keyed on the actor too: the App's dist push starts a run as the App, which on a
  # PR-only key would cancel this one, possibly between approving and arming. Arming twice
  # is a no-op.
  group: bot-automerge-${{ github.event.pull_request.number }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  bot-automerge:
    runs-on: ubuntu-latest
    # The guard reads `pull_request.user.login`, not `github.actor`: the actor is whoever
    # caused this event, so a later push by anyone else, the App's dist push included,
    # would skip the job. The re-run after a dist push terminates: the rebuild is
    # idempotent, so it pushes nothing and arms again, which is a no-op.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'pre-commit-ci[bot]') &&
      !contains(github.event.pull_request.labels.*.name, 'do not auto-merge')
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # `if:` cannot read `secrets`, so the key's presence is exposed here.
      APP_KEY_SET: ${{ secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Dependabot metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        id: dependabot
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
      - name: Build
        run: make build
      - name: Install pre-commit
        run: |
          pip install --upgrade pip
          pip install --upgrade pre-commit
      - name: Cache pre-commit hooks
        id: cache-pre-commit-hooks
        uses: actions/cache@v6
        env:
          CACHE_NUMBER: 0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}-${{ env.CACHE_NUMBER }} # yamllint disable-line rule:line-length
      - name: Install pre-commit hooks
        if: steps.cache-pre-commit-hooks.outputs.cache-hit != 'true'
        run: |
          pre-commit install-hooks
      - run: make check
      - name: Determine if-no-commit log level
        id: log-level
        env:
          ACTOR: ${{ github.event.pull_request.user.login }}
          DEPENDENCY_TYPE: ${{ steps.dependabot.outputs.dependency-type }}
        run: |
          if [ "$ACTOR" = "pre-commit-ci[bot]" ] || [[ "$DEPENDENCY_TYPE" == indirect:* ]]; then
            echo "level=info" >> "$GITHUB_OUTPUT"
          elif [ "$ACTOR" = "dependabot[bot]" ]; then
            if [ "$DEPENDENCY_TYPE" = "direct:development" ]; then
              echo "level=notice" >> "$GITHUB_OUTPUT"
            elif [ "$DEPENDENCY_TYPE" = "direct:production" ]; then
              # Warn, not fail: no commit is harmless, as CI checks that `dist` is current.
              echo "level=warning" >> "$GITHUB_OUTPUT"
            else
              echo "level=warning" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "level=warning" >> "$GITHUB_OUTPUT"
          fi
      # Only the dist commit uses this token.
      - name: Mint app token
        id: app-token
        if: vars.APP_CLIENT_ID != '' && env.APP_KEY_SET == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Commit build changes
        id: commit
        # Pinned to a commit because it runs with a write token; Dependabot bumps it.
        uses: iarekylew00t/verified-bot-commit@1ee4374942e5c5f814e9b3121d766cbe45cea360 # v2.3.6
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          if-no-commit: ${{ steps.log-level.outputs.level }}
          message: 'build(dist): rebuild the action'
          update-local: false
          files: |
            dist/**
      - name: Verify every commit was created by GitHub
        id: provenance
        env:
          GH_TOKEN: ${{ env.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          # Author of the App's dist commits. Named, rather than admitting any bot, so the
          # allow-list stays closed: renaming the App means editing this line, on purpose.
          BUILDER: boilerplate-sync-bot[bot]
        run: |
          # The author login alone proves nothing: it is resolved from the author email,
          # which any pusher can set. So every commit must also be created by GitHub.
          #
          # Merges skip the author check so that Update branch and catch-up merges pass.
          # GitHub also signs commits that an App or `GITHUB_TOKEN` creates through its API,
          # with any tree and parents, so this trusts any holder of a write token. Where the
          # base branch requires approval of the most recent push, the approval below does
          # not count on a commit github-actions pushed.
          #
          # Fails closed: a failed query leaves `trusted` unset, and every later step skips.
          set -euo pipefail
          jq_rows='.[] | [
            (if (.commit.verification.verified == true)
                and (.commit.verification.reason == "valid")
                and ((.committer.login // "") == "web-flow")
                and ((.commit.verification.payload // "") | split("\n")
                     | any(startswith("committer GitHub <noreply@github.com>")))
             then "github" else "elsewhere" end),
            (if (.parents | length) >= 2 then "merge" else "plain" end),
            (.author.login // "<none>")
          ] | join("|")'
          # The endpoint returns at most 250 commits and still exits 0, so refuse rather
          # than inspect part of the pull request.
          total=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.commits')
          if [ "$total" -gt 250 ]; then
            echo "::warning::${total} commits exceeds the 250 this API returns; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          rows=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/commits" --paginate --jq "$jq_rows")
          seen=$(printf '%s\n' "$rows" | grep -c . || true)
          if [ "$seen" -ne "$total" ]; then
            echo "::warning::inspected ${seen} of ${total} commits; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          rejected=0
          while IFS='|' read -r origin kind commit_author; do
            [ -z "$origin" ] && continue
            if [ "$origin" != "github" ]; then
              echo "::warning::a commit was not created by GitHub; holding."
              rejected=$((rejected + 1))
            elif [ "$kind" != "merge" ] \
                 && [ "$commit_author" != "$AUTHOR" ] \
                 && [ "$commit_author" != "$BUILDER" ]; then
              echo "::warning::non-merge commit authored by ${commit_author}; holding."
              rejected=$((rejected + 1))
            fi
          done <<< "$rows"
          if [ "$rejected" -ne 0 ]; then
            echo "trusted=false" >>"$GITHUB_OUTPUT"
          else
            echo "trusted=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Check merge eligibility
        id: eligible
        if: steps.provenance.outputs.trusted == 'true'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
          ECOSYSTEM: ${{ steps.dependabot.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          if [ "$AUTHOR" = "pre-commit-ci[bot]" ]; then
            echo "::notice::pre-commit-ci hook bump; eligible."
            echo "should_merge=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              echo "::notice::Dependabot ${UPDATE_TYPE}; eligible."
              echo "should_merge=true" >>"$GITHUB_OUTPUT"
              ;;
            version-update:semver-major)
              # CI exercises only code a pull request runs, so a major used only by a
              # workflow that no pull request starts merges untested.
              echo "::notice::${ECOSYSTEM:-unknown} major; eligible on green CI."
              echo "should_merge=true" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::Holding ${UPDATE_TYPE:-unknown update type} for a human."
              echo "should_merge=false" >>"$GITHUB_OUTPUT"
              ;;
          esac
      # The rebuild can push a new head, and where stale reviews are dismissed on push, an
      # approval bound to the old head is dismissed. Wait for the PR object to reach the
      # tip, read from git, whose refs are strongly consistent.
      - name: Wait for the PR head to match the pushed commit
        id: head
        if: steps.eligible.outputs.should_merge == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Through git, not REST: a URL path would truncate or misdecode a ref name with
          # `#` or `%`.
          TIP=$(git ls-remote --exit-code origin "refs/heads/${HEAD_REF}" | cut -f1)
          echo "::debug::branch tip is $TIP"
          for _ in $(seq 1 30); do
            PR_HEAD=$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)
            if [ "$PR_HEAD" = "$TIP" ]; then
              echo "sha=$TIP" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "PR head is $PR_HEAD, waiting for $TIP ..."
            sleep 5
          done
          echo "::error::PR head never converged on $TIP"
          exit 1
      # No wait for checks: auto-merge waits for required checks server-side.
      # Re-read the label: one applied during this run is not in the event payload, so the
      # pull request could otherwise be armed with the kill switch applied.
      - name: Re-check the kill switch
        id: switch
        if: steps.eligible.outputs.should_merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read into a variable under `set -e`, so a failed query is not read as "no label".
          set -euo pipefail
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          # Case-insensitive, as GitHub compares label names.
          if grep -qixF 'do not auto-merge' <<< "$labels"; then
            echo "::warning::do not auto-merge applied since this run started; not arming."
            echo "proceed=false" >>"$GITHUB_OUTPUT"
          else
            echo "proceed=true" >>"$GITHUB_OUTPUT"
          fi

      # Approve as github-actions, never as the App: where the base branch requires
      # approval of the most recent push, the last pusher's approval does not count, and
      # the App pushes the dist commit.
      - name: Approve PR
        if: steps.switch.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          REVIEW_STATE=$(gh pr view "$PR_NUMBER" --json reviewDecision -q .reviewDecision)
          if [ "$REVIEW_STATE" = "APPROVED" ]; then
            echo "::notice::PR already approved."
            exit 0
          fi
          echo "::notice::Approving $HEAD_SHA ..."
          # Pinned to the head, so `dismiss_stale_reviews_on_push` does not dismiss it.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            -f "commit_id=$HEAD_SHA" \
            -f 'event=APPROVE' \
            -f 'body=Automated approval: make check passed on this commit.'
      - name: Enable auto-merge
        if: steps.switch.outputs.proceed == 'true'
        run: |
          echo "::notice::Enabling auto-merge for PR #$PR_NUMBER"
          gh pr merge --auto --squash "$PR_NUMBER"
