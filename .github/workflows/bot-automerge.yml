---
name: Bot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A ruleset that requires status checks to pass should be configured for the repository.
#
# Hands-free dist commits need a GitHub App credential: set the APP_ID repo
# variable and the APP_PRIVATE_KEY secret in BOTH stores (Actions and
# Dependabot — dependabot-triggered runs only see Dependabot secrets).
# App-token API pushes are GitHub-signed and re-fire pull_request CI.
# Without the App, the commit falls back to GITHUB_TOKEN: still verified,
# but CI does not re-fire on the new head and the armed auto-merge waits
# until a maintainer re-triggers checks.

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  # Keyed by actor as well as PR. The dist rebuild below pushes with an App token,
  # and that push re-fires pull_request/synchronize under a *different* actor. On a
  # PR-only key that run joins this run's group and cancels us mid-flight: run
  # 30679210030 was cancelled by 30679291569 (actor boilerplate-sync-bot[bot]) 5s
  # after its own push, on every dist push observed.
  #
  # The consequence used to be worse than a cancellation. The job gate read
  # github.actor, so the replacement run skipped as well, and approval and
  # auto-merge then ran for nobody. That gate now reads pull_request.user.login and
  # the replacement completes, so a PR-only key would no longer strand anything --
  # but the keying stays, because being cancelled between approving and arming is
  # still a worse outcome than running twice, and arming twice is a no-op.
  #
  # Same-actor supersession still collapses, which is what cancel-in-progress is
  # here for: the opened/labeled event burst and dependabot's own rebase force-push
  # both arrive as dependabot[bot].
  group: bot-automerge-${{ github.event.pull_request.number }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  bot-automerge:
    runs-on: ubuntu-latest
    # Reads pull_request.user.login rather than github.actor, and that swap has a
    # consequence worth stating because it is not obvious. github.actor is whoever
    # triggered *this event*, so the dist push below made the resulting synchronize
    # event's actor the App and this job skipped -- which is why the concurrency note
    # above describes approval and auto-merge never running for anyone. user.login
    # stays dependabot[bot] for the life of the pull request, so the job now *does*
    # re-run after its own dist push.
    #
    # That terminates rather than looping: the rebuild is idempotent, so the second
    # run finds dist current, commits nothing, pushes nothing, and simply arms again.
    # Arming twice is a no-op. What it does mean is that the provenance step below
    # sees the dist commit, which is why that step accepts a second author.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'pre-commit-ci[bot]') &&
      !contains(github.event.pull_request.labels.*.name, 'do not auto-merge')
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # GitHub's documented context-availability table excludes secrets
      # from if expressions (actionlint enforces it); hoist presence here.
      APP_KEY_SET: ${{ secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Dependabot metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        id: dependabot
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
      - name: Build
        run: make build
      - name: Install pre-commit
        run: |
          pip install --upgrade pip
          pip install --upgrade pre-commit
      - name: Cache pre-commit hooks
        id: cache-pre-commit-hooks
        uses: actions/cache@v6
        env:
          CACHE_NUMBER: 0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}-${{ env.CACHE_NUMBER }} # yamllint disable-line rule:line-length
      - name: Install pre-commit hooks
        if: steps.cache-pre-commit-hooks.outputs.cache-hit != 'true'
        run: |
          pre-commit install-hooks
      - run: make check
      - name: Determine if-no-commit log level
        id: log-level
        env:
          ACTOR: ${{ github.event.pull_request.user.login }}
          DEPENDENCY_TYPE: ${{ steps.dependabot.outputs.dependency-type }}
        run: |
          if [ "$ACTOR" = "pre-commit-ci[bot]" ] || [[ "$DEPENDENCY_TYPE" == indirect:* ]]; then
            echo "level=info" >> "$GITHUB_OUTPUT"
          elif [ "$ACTOR" = "dependabot[bot]" ]; then
            if [ "$DEPENDENCY_TYPE" = "direct:development" ]; then
              echo "level=notice" >> "$GITHUB_OUTPUT"
            elif [ "$DEPENDENCY_TYPE" = "direct:production" ]; then
              # A no-op rebuild is benign; CI's dist-up-to-date check is the
              # real staleness gate. Keep it visible without failing the run.
              echo "level=warning" >> "$GITHUB_OUTPUT"
            else
              echo "level=warning" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "level=warning" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint app token
        id: app-token
        if: vars.APP_ID != '' && env.APP_KEY_SET == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Commit build changes
        id: commit
        uses: iarekylew00t/verified-bot-commit@v2
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          if-no-commit: ${{ steps.log-level.outputs.level }}
          message: 'build(dist): rebuild the action'
          update-local: false
          files: |
            dist/**
      - name: Verify every commit was created by GitHub
        id: provenance
        env:
          GH_TOKEN: ${{ env.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          # The dist rebuild above commits as the App, so its commits are authored by a
          # third identity that is neither the pull request author nor a merge. Naming it
          # here rather than accepting any bot keeps the allow-list closed: renaming the
          # App means editing this line, and that coupling is the point.
          BUILDER: boilerplate-sync-bot[bot]
        run: |
          # Every commit must have been created by GitHub itself, and be authored either by
          # the bot that opened the pull request or by this repository's own dist builder,
          # unless it is a merge.
          #
          # `.committer.login == "web-flow"` is the load-bearing half. GitHub resolves that
          # field from the signing key itself, so it is not git metadata a pusher can set.
          # The author test cannot carry this weight: `.author.login` resolves from the
          # commit's author email, so anyone who can push here can set it to a bot's noreply
          # address. Measured on this repository's own history: a dist commit reports
          # `author=boilerplate-sync-bot[bot]`, `committer=web-flow`, `verified=true`,
          # `reason=valid`, and a Dependabot commit reports `author=dependabot[bot]` with
          # the same committer -- so both are admitted and a locally pushed commit is not.
          #
          # The payload test stays as an independent second condition rather than as the
          # argument, because on its own it would rest on an unstated premise about when
          # GitHub declines to mark a commit verified.
          #
          # Merges are exempt from the author check but not from the signature check, and
          # that pairing is what makes the exemption safe. A merge commit's tree is not
          # constrained to be the mechanical merge of its parents, so a local "evil merge"
          # can carry content present in neither parent while contributing no non-merge
          # commits to the range. Requiring GitHub's signature rules that out, which is what
          # lets a required Update branch merge through without reopening the hole.
          #
          # `set -e` does the fail-closed work. Every hand-written error branch here would
          # be a way to fail open instead, so there is no `2>/dev/null` and no `|| fallback`.
          set -euo pipefail
          jq_rows='.[] | [
            (if (.commit.verification.verified == true)
                and (.commit.verification.reason == "valid")
                and ((.committer.login // "") == "web-flow")
                and ((.commit.verification.payload // "") | split("\n")
                     | any(startswith("committer GitHub <noreply@github.com>")))
             then "github" else "elsewhere" end),
            (if (.parents | length) >= 2 then "merge" else "plain" end),
            (.author.login // "<none>")
          ] | join("|")'
          # This endpoint returns at most 250 commits and `--paginate` still exits 0, so a
          # longer pull request would be inspected only in part and the unseen tail could be
          # anything. Count first and refuse rather than under-inspect.
          total=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.commits')
          if [ "$total" -gt 250 ]; then
            echo "::warning::${total} commits exceeds the 250 this API returns; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          rows=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/commits" --paginate --jq "$jq_rows")
          seen=$(printf '%s\n' "$rows" | grep -c . || true)
          if [ "$seen" -ne "$total" ]; then
            echo "::warning::inspected ${seen} of ${total} commits; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          rejected=0
          while IFS='|' read -r origin kind commit_author; do
            [ -z "$origin" ] && continue
            if [ "$origin" != "github" ]; then
              echo "::warning::a commit was not created by GitHub; holding."
              rejected=$((rejected + 1))
            elif [ "$kind" != "merge" ] \
                 && [ "$commit_author" != "$AUTHOR" ] \
                 && [ "$commit_author" != "$BUILDER" ]; then
              echo "::warning::non-merge commit authored by ${commit_author}; holding."
              rejected=$((rejected + 1))
            fi
          done <<< "$rows"
          if [ "$rejected" -ne 0 ]; then
            echo "trusted=false" >>"$GITHUB_OUTPUT"
          else
            echo "trusted=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Check merge eligibility
        id: eligible
        if: steps.provenance.outputs.trusted == 'true'
        env:
          GH_TOKEN: ${{ env.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
          ECOSYSTEM: ${{ steps.dependabot.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          if [ "$AUTHOR" = "pre-commit-ci[bot]" ]; then
            echo "::notice::pre-commit-ci hook bump; eligible."
            echo "should_merge=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              echo "::notice::Dependabot ${UPDATE_TYPE}; eligible."
              echo "should_merge=true" >>"$GITHUB_OUTPUT"
              ;;
            version-update:semver-major)
              # Majors are gated on ecosystem, because ecosystem decides whether a green
              # pull request is evidence about the change.
              #
              # `github-actions` arms unless the diff reaches a workflow no pull request
              # runs. The actions here are pinned to floating major tags, so Dependabot
              # raises an actions pull request only when a major moves -- which made a
              # blanket major hold a permanent hold on every actions pull request there
              # would ever be. The cooldown in dependabot.yml is the soak that replaces it.
              #
              # The hold list earns its keep here because this repository publishes: the
              # release, marketplace and template-sync paths are all driven by workflows a
              # pull request never executes, and a break in one of those is invisible until
              # it matters. For actions the changed file IS the blast radius, since an
              # action runs only where its `uses:` line is written, so a per-file test is
              # sound here in a way it would not be for npm -- where a package can be
              # imported anywhere and the diff would touch package.json alone.
              #
              # Listed rather than inferred, which is this branch's known weakness: a
              # workflow's triggers can change without this file noticing, and a stale list
              # fails by arming. Re-derive it when a trigger changes.
              #
              # Query and match are separate statements on purpose. As one pipeline the
              # trailing `|| true` -- needed because grep exits 1 when it matches nothing --
              # would also swallow the query failing, and an unreadable file list would then
              # count as zero held files and arm. Both the new and the previous path of every
              # changed file, because a rename reports the old one separately.
              if [ "$ECOSYSTEM" = "github-actions" ]; then
                changed=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" --paginate \
                  --jq '.[] | .filename, (.previous_filename // empty)')
                held=$(printf '%s\n' "$changed" \
                  | grep -cFx -e '.github/workflows/release.yml' \
                               -e '.github/workflows/release-provenance.yml' \
                               -e '.github/workflows/marketplace-smoke.yml' \
                               -e '.github/workflows/sync-template-github-workflows.yml' \
                               -e '.github/workflows/sync-template-non-workflow.yml' \
                               -e '.github/workflows/readme-action-versions.yml' \
                               -e '.github/workflows/pre-commit-autoupdate.yml' \
                               -e '.github/workflows/app-token-check.yml' \
                  || true)
                if [ "$held" -ne 0 ]; then
                  echo "::warning::actions major reaches a workflow no PR runs; holding."
                  echo "should_merge=false" >>"$GITHUB_OUTPUT"
                else
                  echo "::notice::actions major, only where a PR exercises it; eligible."
                  echo "should_merge=true" >>"$GITHUB_OUTPUT"
                fi
              else
                echo "::warning::${ECOSYSTEM:-unknown} major is not exercised end to end; holding."
                echo "should_merge=false" >>"$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "::warning::Holding ${UPDATE_TYPE:-unknown update type} for a human."
              echo "should_merge=false" >>"$GITHUB_OUTPUT"
              ;;
          esac
      # The rebuild above pushes a new head, and the ruleset dismisses stale
      # reviews on push. Approving before the PR object repoints binds the
      # review to the pre-push SHA, so the dismissal that fires for our own
      # push immediately voids it -- leaving auto-merge armed behind a
      # REVIEW_REQUIRED nothing will ever satisfy. Converge on the real tip
      # first. Git refs are strongly consistent, so the ref store is the
      # source of truth while the PR object catches up.
      - name: Wait for the PR head to match the pushed commit
        id: head
        if: steps.eligible.outputs.should_merge == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Read the tip through git rather than a REST path. Ref names may
          # legally contain '#' and '%' (git check-ref-format allows both),
          # which a URL path segment would truncate or misdecode into a
          # different ref. ls-remote transfers no objects, so the shallow
          # clone and update-local:false do not matter here.
          TIP=$(git ls-remote --exit-code origin "refs/heads/${HEAD_REF}" | cut -f1)
          echo "::debug::branch tip is $TIP"
          for _ in $(seq 1 30); do
            PR_HEAD=$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)
            if [ "$PR_HEAD" = "$TIP" ]; then
              echo "sha=$TIP" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "PR head is $PR_HEAD, waiting for $TIP ..."
            sleep 5
          done
          echo "::error::PR head never converged on $TIP"
          exit 1
      # No wait step for checks: auto-merge waits for required checks
      # server-side, and make check above already validated the tree.
      # The label is re-read live here rather than taken from the event payload. A label
      # applied while this run was in flight is not in that payload, and this run is long --
      # it builds, installs hooks, runs `make check` and waits for the head to converge --
      # so the window is wide. Without this the pull request could be armed with the kill
      # switch already applied.
      - name: Re-check the kill switch
        id: switch
        if: steps.eligible.outputs.should_merge == 'true'
        run: |
          # Read into a variable first, under `set -e`. Piping the query straight into grep
          # would treat a failed query as "label absent" -- grep sees no input, matches
          # nothing, and the run proceeds without having verified the switch at all.
          set -euo pipefail
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          # Case-insensitive and fixed-string, matching how GitHub treats label names:
          # they are unique case-insensitively, so "Do Not Auto-Merge" is the same switch
          # to a human and has to be to this check too.
          if grep -qixF 'do not auto-merge' <<< "$labels"; then
            echo "::warning::do not auto-merge applied since this run started; not arming."
            echo "proceed=false" >>"$GITHUB_OUTPUT"
          else
            echo "proceed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Approve PR
        if: steps.switch.outputs.proceed == 'true'
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          REVIEW_STATE=$(gh pr view "$PR_NUMBER" --json reviewDecision -q .reviewDecision)
          if [ "$REVIEW_STATE" = "APPROVED" ]; then
            echo "::notice::PR already approved."
            exit 0
          fi
          echo "::notice::Approving $HEAD_SHA ..."
          # Pin the review to the exact head. An approval bound to the current
          # head is not stale, so dismiss_stale_reviews_on_push leaves it be.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            -f "commit_id=$HEAD_SHA" \
            -f 'event=APPROVE' \
            -f 'body=Automated approval: make check passed on this commit.'
      - name: Enable auto-merge
        if: steps.switch.outputs.proceed == 'true'
        run: |
          echo "::notice::Enabling auto-merge for PR #$PR_NUMBER"
          gh pr merge --auto --squash "$PR_NUMBER"
