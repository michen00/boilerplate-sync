---
name: Release

# release-please maintains one release PR; merging it is the only human step.
#
# The annotated tag is pushed first because release-please's POST /releases
# would otherwise create a lightweight one.
#
# release-please still creates the Release. With skip-github-release, nothing
# clears its "autorelease: pending" label, and after one more release PR it
# opens none, without failing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Queue rather than cancel: a run killed between the tag push and the release
# would leave a tag without a release.
concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_KEY_SET: ${{ secrets.APP_PRIVATE_KEY != '' }}

jobs:
  release:
    runs-on: ubuntu-latest
    # A dispatch on another branch would tag it and move vN, which consumers
    # follow, onto it.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Require the App credential
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ "$APP_KEY_SET" != "true" ]; then
            echo "::error::Set vars.APP_CLIENT_ID and secrets.APP_PRIVATE_KEY first."
            echo "::error::A release PR opened by GITHUB_TOKEN receives no"
            echo "::error::check runs and can never satisfy main-protect."
            exit 1
          fi

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # fetches tags, which the tagging step checks for
          token: ${{ steps.app-token.outputs.token }}

      - name: Decide whether a tag is due
        id: due
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION=$(jq -r '.["."] // empty' .release-please-manifest.json)
          if [ -z "$VERSION" ]; then
            echo "::error::no '.' version in .release-please-manifest.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          # Only a definite not-found sets due=true. Treating a failed call as
          # absence would move vN onto unreleased code.
          set +e
          OUT=$(gh release view "v${VERSION}" --json tagName 2>&1)
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "::notice::v${VERSION} is already released; nothing to tag."
            echo "due=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$OUT" | grep -qi 'release not found'; then
            echo "::notice::v${VERSION} has no release yet; tagging."
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not determine release state for v${VERSION}"
            echo "::error::${OUT}"
            exit 1
          fi

      - name: Tag the release
        if: steps.due.outputs.due == 'true'
        env:
          VERSION: ${{ steps.due.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          # On a rerun the tag is already fetched. Pushing it unchanged is a
          # no-op, which release-tags-protect allows.
          if git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "::notice::tag v${VERSION} already exists; push is a no-op."
          else
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
          fi
          git push origin "refs/tags/v${VERSION}"

      - name: Move the major alias
        if: steps.due.outputs.due == 'true'
        env:
          VERSION: ${{ steps.due.outputs.version }}
          MAJOR: ${{ steps.due.outputs.major }}
        run: |
          # Moved before release-please publishes, because marketplace-smoke.yml
          # tests the alias on release:published. Anchored to the release tag,
          # not HEAD, which a retry may have moved past. release-tags-protect
          # covers only v*.*.*, so vN can be force-pushed.
          git tag -f -a "v${MAJOR}" -m "Alias for v${VERSION}" \
            "refs/tags/v${VERSION}^{commit}"
          git push --force origin "refs/tags/v${MAJOR}"

      # Runs on every push. It publishes the Release on the tag above, with the
      # App token so release:published starts release-provenance.yml, then
      # opens or updates the next release PR.
      - name: Publish the release and refresh the release PR
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Never add release-type: it switches the action to inline config,
          # which ignores release-please-config.json. Without that file's
          # include-component-in-tag: false, release-please looks for
          # boilerplate-sync-vX.Y.Z tags and proposes 2.0.0 from all of history.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Otherwise readme-action-versions.yml waits for its Monday cron to repin
      # the README's Security example. Cosmetic, so it never fails the release.
      # A workflow_dispatch from GITHUB_TOKEN always starts a run, and the App
      # lacks Actions write.
      - name: Refresh README version pins
        if: steps.due.outputs.due == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run readme-action-versions.yml
