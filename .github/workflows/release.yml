---
name: Release

# release-please maintains one release PR. Merging it is the only human step.
#
# The tag step pushes an annotated tag first, because release-please's
# POST /releases creates a lightweight one.
#
# release-please creates the Release itself. That step also clears the
# "autorelease: pending" label, so the next release PR can open.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Runs queue, so each tag push is followed by its release.
concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_KEY_SET: ${{ secrets.APP_PRIVATE_KEY != '' }}

jobs:
  release:
    runs-on: ubuntu-latest
    # Tags and vN, which consumers follow, come only from main.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Require the App credential
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ "$APP_KEY_SET" != "true" ]; then
            echo "::error::Set vars.APP_CLIENT_ID and secrets.APP_PRIVATE_KEY first."
            echo "::error::The App token starts the release PR's checks automatically."
            exit 1
          fi

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # fetches tags, which the tagging step checks for
          token: ${{ steps.app-token.outputs.token }}

      - name: Decide whether a tag is due
        id: due
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION=$(jq -r '.["."] // empty' .release-please-manifest.json)
          if [ -z "$VERSION" ]; then
            echo "::error::no '.' version in .release-please-manifest.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          # Only "release not found" sets due=true. Other errors fail the job,
          # so vN stays on released code.
          set +e
          OUT=$(gh release view "v${VERSION}" --json tagName 2>&1)
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "::notice::v${VERSION} is already released; nothing to tag."
            echo "due=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$OUT" | grep -qi 'release not found'; then
            echo "::notice::v${VERSION} has no release yet; tagging."
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not determine release state for v${VERSION}"
            echo "::error::${OUT}"
            exit 1
          fi

      - name: Tag the release
        if: steps.due.outputs.due == 'true'
        env:
          VERSION: ${{ steps.due.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          # release-tags-protect allows a rerun's unchanged push of the tag.
          if git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "::notice::tag v${VERSION} already exists; push is a no-op."
          else
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
          fi
          git push origin "refs/tags/v${VERSION}"

      - name: Move the major alias
        if: steps.due.outputs.due == 'true'
        env:
          VERSION: ${{ steps.due.outputs.version }}
          MAJOR: ${{ steps.due.outputs.major }}
        run: |
          # Moved before publishing, because marketplace-smoke.yml tests the
          # alias on release:published. It follows the release tag, since HEAD
          # can move between retries. release-tags-protect covers only v*.*.*,
          # so vN can move.
          git tag -f -a "v${MAJOR}" -m "Alias for v${VERSION}" \
            "refs/tags/v${VERSION}^{commit}"
          git push --force origin "refs/tags/v${MAJOR}"

      # Runs on every push. It publishes the Release on the tag above and
      # refreshes the next release PR. Releases made with the App token start
      # release-provenance.yml.
      - name: Publish the release and refresh the release PR
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          # A release-type input switches the action to inline config, which
          # bypasses release-please-config.json. That file sets
          # include-component-in-tag: false to match the vX.Y.Z tags.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Repins the README's Security example now instead of at the Monday cron.
      # A failure here is cosmetic. GITHUB_TOKEN has Actions write, and its
      # dispatches start runs.
      - name: Refresh README version pins
        if: steps.due.outputs.due == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run readme-action-versions.yml
