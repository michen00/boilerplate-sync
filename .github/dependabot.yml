---
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      major:
        update-types: [major]
      minor-patch:
        update-types: [minor, patch]
    cooldown:
      semver-major-days: 30
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 0 1,15 * *' # 1st and 15th monthly at midnight UTC
    groups:
      actions:
        patterns: ['*']
    ignore:
      # Self-references, all pinned deliberately: marketplace-smoke.yml
      # consumes @v1 to exercise the movable alias the README advertises and
      # @v1.0.0 to prove the oldest release still runs, while the two
      # sync-template workflows track @main. #160 rewrote both smoke refs to
      # @v1.0.4, which collapsed the canary into two copies of one commit.
      - dependency-name: michen00/boilerplate-sync
    cooldown:
      # Parity with the npm ecosystem above. Without it #160's four majors,
      # including a two-major codecov jump, arrived the day after publication
      # with no soak time.
      #
      # default-days, not semver-major-days: GitHub rejects the semver-* keys
      # for this ecosystem ("not supported for the package ecosystem
      # 'github-actions'"), which invalidated the whole file and got the
      # github-actions entry -- ignore rules and grouping included -- dropped.
      default-days: 30
